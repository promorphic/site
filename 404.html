<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promorphic — Not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // The visitor's saved choice, else their system setting. Set before first paint.
    (function () {
      var root = document.documentElement, theme = null;
      root.className = 'js';
      try { theme = localStorage.getItem('pm-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      root.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* ── Tokens (Promorphic design system, tokens.json v2: amber has three jobs, text is always neutral) ──
       The page is one theme at a time, set on <html data-theme>: the visitor's choice, else their system setting. Without JavaScript it follows the system setting. */
    :root, [data-theme="dark"] {
      --surface-0: #0b0c0e; --surface-1: #14161a; --surface-2: #1c1f24; --hairline: #2a2e35;
      --ink: #f2efe8; --ink-muted: #a8a49b; --ink-faint: #8a867e;
      --brand: #f2b135; --brand-strong: #ffc85a; --on-brand: #14110a;
      --focus: var(--ink); --overlay: #0b0c0ecc;
      color-scheme: dark;
    }
    [data-theme="light"] {
      --surface-0: #f7f5f0; --surface-1: #ffffff; --surface-2: #ede9e1; --hairline: #d9d4ca;
      --ink: #14130f; --ink-muted: #5c5950; --ink-faint: #6e6a60;
      --brand: #f2b135; --brand-strong: #e0a020; --on-brand: #14110a;
      --focus: var(--ink); --overlay: #f7f5f0cc;
      color-scheme: light;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --surface-0: #f7f5f0; --surface-1: #ffffff; --surface-2: #ede9e1; --hairline: #d9d4ca;
        --ink: #14130f; --ink-muted: #5c5950; --ink-faint: #6e6a60;
        --brand-strong: #e0a020;
        --focus: var(--ink); --overlay: #f7f5f0cc;
        color-scheme: light;
      }
    }
    :root {
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --space-7: 48px; --space-8: 64px; --space-9: 96px; --space-10: 128px;
      --radius-none: 0; --radius-sm: 2px; --radius-md: 4px; --radius-pill: 999px;
      --measure: 640px; --container: 1200px; --control-h: 48px; --control-h-sm: 36px; --border-w: 1px;
      --font-sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Geist Mono", "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      /* Page-level lengths derived from the tokens above */
      --header-h: var(--space-8); --gutter: var(--space-4); --section-pad: var(--space-7);
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { background: var(--surface-0); color: var(--ink); transition: background-color 150ms var(--ease), color 150ms var(--ease); font-family: var(--font-sans); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; }
    strong { font-weight: 500; }
    strong.b { font-weight: 700; }
    strong.u { font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
    /* the amber underline: a claim marked in the brand colour, text stays ink */
    .u-brand { color: var(--ink); text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
    .display-lg .u-brand { text-decoration-thickness: 0.06em; text-underline-offset: 0.12em; }
    /* box headings carry the amber underline too: problem rows, the three parts, the who-it's-for and control cards */
    .panel h3, .card h3, .part-text h3 { width: -moz-fit-content; width: fit-content; text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter); }
    .section { padding: var(--section-pad) 0; border-top: var(--border-w) solid var(--hairline); scroll-margin-top: calc(var(--header-h) + var(--space-6) - var(--section-pad)); }
    .section-flush { padding-top: 0; border-top: 0; scroll-margin-top: calc(var(--header-h) + var(--space-6)); }
    .section-rule { border-top: var(--border-w) solid var(--hairline); }
    .measure { max-width: var(--measure); }
    .measure-wide { max-width: 760px; }
    .lead { font-size: 20px; line-height: 1.5; letter-spacing: -0.005em; }
    .muted { color: var(--ink-muted); }
    p + p { margin-top: var(--space-4); }
    .skip { position: absolute; left: var(--gutter); top: -100px; z-index: 20; }
    .skip:focus { top: var(--space-2); }

    /* ── Type ── */
    .display-xl { font-size: clamp(44px, 7.5vw, 72px); line-height: 1.02; font-weight: 500; letter-spacing: -0.03em; }
    .display-lg { font-size: clamp(32px, 5vw, 48px); line-height: 1.08; font-weight: 500; letter-spacing: -0.025em; }
    .heading-md { font-size: 24px; line-height: 1.2; font-weight: 500; letter-spacing: -0.015em; }
    .heading-sm { font-size: 20px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em; }
    .eyebrow { display: inline-flex; align-items: center; gap: var(--space-3); font-family: var(--font-mono); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; color: var(--ink-muted); margin-bottom: var(--space-4); }
    .eyebrow::after { content: ""; display: inline-block; width: var(--space-6); height: var(--border-w); background: var(--hairline); }
    .label { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; }

    /* ── Header ── */
    .header { position: sticky; top: 0; z-index: 10; background: var(--overlay); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: var(--border-w) solid var(--hairline); transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease); }
    .header .container { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: var(--space-4); }
    .wordmark { display: inline-flex; align-items: center; gap: var(--space-2); text-decoration: none; font-size: 20px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
    .mark { flex: none; display: block; }
    .mark .mark-block { fill: var(--ink); transition: fill 150ms var(--ease); }
    .mark .mark-bar { fill: var(--brand); }
    .nav { display: none; gap: var(--space-5); }
    .nav a { text-decoration: none; font-size: 15px; color: var(--ink-muted); transition: color 150ms var(--ease); }
    .nav a:hover { color: var(--ink); }
    .header-actions { display: flex; align-items: center; gap: var(--space-4); }
    /* Theme toggle: a switch, off for the light version and on for the dark one */
    .theme-switch { flex: none; position: relative; width: 44px; height: 24px; padding: 0; background: var(--surface-1); border: var(--border-w) solid var(--hairline); border-radius: var(--radius-pill); cursor: pointer; transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
    .theme-switch:hover { border-color: var(--ink-faint); }
    .theme-switch-knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); background: var(--ink); color: var(--surface-0); transition: transform 150ms var(--ease), background-color 150ms var(--ease), color 150ms var(--ease); }
    .theme-switch-knob svg { display: block; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .theme-switch .icon-moon { display: none; }
    [data-theme="dark"] .theme-switch-knob { transform: translateX(20px); }
    [data-theme="dark"] .theme-switch .icon-sun { display: none; }
    [data-theme="dark"] .theme-switch .icon-moon { display: block; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-5); font-family: var(--font-sans); font-size: 15px; line-height: 1; font-weight: 500; text-decoration: none; border-radius: var(--radius-sm); border: var(--border-w) solid transparent; white-space: nowrap; cursor: pointer; transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease); }
    .btn-primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
    .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
    .btn-secondary { background: transparent; color: var(--ink); border-color: var(--hairline); }
    .btn-secondary:hover { border-color: var(--ink-faint); background: var(--surface-1); }
    .btn-sm { height: var(--control-h-sm); padding: 0 var(--space-4); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }

    /* ── Hero: the skyline behind the headline, drifting slowly and fading into the page ── */
    .hero { position: relative; overflow: hidden; display: flex; align-items: center; min-height: min(600px, calc(100svh - var(--header-h))); padding: var(--space-8) 0 var(--space-7); }
    .hero .container { position: relative; z-index: 1; }
    .skyline { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .skyline img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; filter: grayscale(1) brightness(.9); transform-origin: 50% 70%; animation: pm-skyline-in 2.4s var(--ease) both, pm-skyline-drift 24s ease-in-out infinite alternate; }
    [data-theme="light"] .skyline img { filter: grayscale(1) invert(1) brightness(1.04) contrast(.8); }
    @media (prefers-color-scheme: light) { :root:not([data-theme]) .skyline img { filter: grayscale(1) invert(1) brightness(1.04) contrast(.8); } }
    /* the photo fades into the page ground at its edges, so it never has a hard edge */
    .skyline::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, color-mix(in srgb, var(--surface-0) 60%, transparent) 0%, color-mix(in srgb, var(--surface-0) 45%, transparent) 42%, transparent 68%), linear-gradient(to bottom, color-mix(in srgb, var(--surface-0) 40%, transparent) 0%, transparent 35%, transparent 55%, var(--surface-0) 100%); }
    /* Phones: the photo is taller than the hero and pinned to its top, so the skyline sits down beside the buttons rather than mid-frame */
    @media (max-width: 719px) {
      .skyline img { height: 145%; object-position: 50% 0; }
      .skyline::after { background: linear-gradient(to bottom, color-mix(in srgb, var(--surface-0) 62%, transparent) 0%, color-mix(in srgb, var(--surface-0) 55%, transparent) 45%, color-mix(in srgb, var(--surface-0) 30%, transparent) 78%, var(--surface-0) 100%); }
    }
    @keyframes pm-skyline-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pm-skyline-drift { from { transform: scale(1.04) translate(2%, 0); } to { transform: scale(1.14) translate(-2%, -2%); } }
    /* Headline highlight: one block, so every band is the same length; a band per line, 0.1em apart */
    .hero h1 { line-height: 1.3; }
    .hl { display: block; width: -moz-fit-content; width: fit-content; max-width: 100%; padding: 0 0.16em; color: var(--on-brand); background: linear-gradient(to bottom, transparent 0.05em, var(--brand) 0.05em, var(--brand) calc(100% - 0.05em), transparent calc(100% - 0.05em)) 0 0 / 100% 1.3em repeat-y; }
    .hl br { display: none; }
    @media (min-width: 480px) { .hl br { display: inline; } }
    @media (max-width: 479px) {
      .hero h1 { font-size: min(44px, 10.5vw); line-height: 1.4; }
      /* on a phone the headline wraps where it must, so each line gets a band of its own width, with a sliver of ground between bands as on desktop */
      .hl { display: inline; padding: 0 0.16em; background: var(--brand); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    }
    .hero .sub { margin-top: var(--space-5); color: var(--ink-muted); }
    .hero .sub strong { display: block; color: var(--ink); }
    /* the secondary button sits on the skyline photograph: a solid ground keeps the texture out of it */
    .hero .btn-secondary { background: var(--surface-0); border-color: var(--ink-faint); }
    .hero .btn-secondary:hover { background: var(--surface-1); border-color: var(--ink); }
    .hero .sub strong + br { display: none; }

    /* ── Hero figure: streams converge on the layer and fan out to the venues ── */
    .diagram { margin-top: var(--space-6); padding-top: var(--space-4); }
    #layer .diagram { margin-top: var(--space-6); }
    .ig { display: block; width: 100%; height: auto; max-width: 100%; }
    .ig-streams .s-rule { stroke: var(--hairline); stroke-width: 1; opacity: .55; }
    .ig-streams .s-stream { fill: none; stroke: var(--ink-faint); stroke-width: 1.25; opacity: .7; }
    .ig-streams .s-flow { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 28 260; animation: pm-flow 12s linear infinite; }
    @keyframes pm-flow { from { stroke-dashoffset: 576; } to { stroke-dashoffset: 0; } }
    .streams.is-paused .s-flow { animation-play-state: paused; }
    .ig-streams .s-hair { stroke: var(--hairline); stroke-width: 1; }
    .ig-streams .f-s0 { fill: var(--surface-0); }
    .ig-streams .f-ink { fill: var(--ink); }
    .ig-streams .f-brand { fill: var(--brand); }
    .ig-streams .t-mono { font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; }
    .ig-streams .t-sans { font-family: var(--font-sans); }
    .ig-streams .t-name { font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
    .ig-streams .t-sm { font-size: 12px; font-weight: 500; letter-spacing: .14em; }
    .ig-streams .t-ph { font-size: 17px; letter-spacing: .04em; }
    .ig-streams .t-ph-layer { font-size: 17px; font-weight: 500; letter-spacing: .14em; }
    .ig-streams .t-ink { fill: var(--ink); }
    .ig-streams .t-muted { fill: var(--ink-muted); }
    .ig-streams .t-brandink { fill: var(--ink-muted); }
    /* Streams v4 additions: the layer's box is raised (surface-1); waypoints are hollow; tier headings are captions */
    .ig-streams .f-s1 { fill: var(--surface-1); }
    .ig-streams .s-node { fill: var(--surface-0); stroke: var(--ink-faint); stroke-width: 1; }
    .ig-streams .s-rail { stroke: var(--hairline); stroke-width: 1; }
    .ig-streams .t-faint { fill: var(--ink-faint); }
    .ig-streams .s-hair-line { stroke: var(--hairline); stroke-width: 1; }
    .ig-streams .f-onbrand { fill: var(--on-brand); }
    .ig-streams .t-onbrand-fill { fill: var(--on-brand); }
    .ig-streams .t-onbrand { fill: var(--on-brand); }
    .ig-streams .agent-mark.on-dark { display: none; }
    [data-theme="dark"] .ig-streams .agent-mark.on-light { display: none; }
    [data-theme="dark"] .ig-streams .agent-mark.on-dark { display: inline; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) .ig-streams .agent-mark.on-light { display: none; } :root:not([data-theme]) .ig-streams .agent-mark.on-dark { display: inline; } }
    .ig-streams .agent { cursor: default; }
    .ig-streams .agent-tip { opacity: 0; transition: opacity 150ms cubic-bezier(0.2,0.7,0.2,1); pointer-events: none; }
    .ig-streams .agent:hover .agent-tip, .ig-streams .agent:focus .agent-tip { opacity: 1; }
    [data-theme="dark"] .ig-streams .agent-mark.on-light { display: none; }
    [data-theme="dark"] .ig-streams .agent-mark.on-dark { display: inline; }
    .streams-desktop { display: none; }
    .streams-phone, .streams-phone ~ .diagram-caption { max-width: 480px; margin-left: auto; margin-right: auto; }
    @media (min-width: 720px) { .streams-phone { max-width: 600px; } }
    .diagram-caption { margin-top: var(--space-4); color: var(--ink-faint); text-align: center; }

    /* ── Grids & cards ── */
    .grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
    .card { background: var(--surface-1); border: var(--border-w) solid var(--hairline); border-radius: var(--radius-sm); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
    .card:hover { background: var(--surface-2); border-color: var(--ink-faint); }
    .card .idx { font-family: var(--font-mono); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 0.14em; color: var(--ink-muted); }
    .card h3 { color: var(--ink); }
    .card p { font-size: 15px; line-height: 1.55; color: var(--ink-muted); }
    .stat { background: var(--surface-1); border: var(--border-w) solid var(--hairline); border-radius: var(--radius-sm); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
    .stat .value { font-family: var(--font-mono); font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
    .stat .caption { font-size: 15px; line-height: 1.55; color: var(--ink-muted); }
    .stat .source { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; color: var(--ink-faint); margin-top: var(--space-1); }
    .section-head { margin-bottom: var(--space-5); }
    /* Why now: a ledger with two sides, the assets and the agents, and the layer between them */
    .sides { display: grid; grid-template-columns: 1fr; gap: var(--space-6); }
    .side { display: flex; flex-direction: column; }
    .side-head { align-self: flex-start; font-family: var(--font-mono); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-brand); background: var(--brand); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-3); }
    .entry { padding: var(--space-4) 0; border-top: var(--border-w) solid var(--hairline); display: grid; grid-template-columns: 1fr; row-gap: var(--space-1); }
    .side-head + .entry { border-top: 0; }
    .entry .value { font-family: var(--font-mono); font-size: 36px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); margin-bottom: var(--space-1); }
    .entry .caption { font-size: 15px; line-height: 1.5; color: var(--ink-muted); max-width: 38ch; }
    .entry .source { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; color: var(--ink-faint); }
    .entry-lg { flex: 1; align-content: center; }
    .entry-lg .value { font-size: 64px; }
    /* from 600px each entry is one row: the number on the left, its caption and source beside it */
    @media (min-width: 600px) {
      .entry { grid-template-columns: 200px 1fr; column-gap: var(--space-5); align-items: center; }
      .entry .value { grid-row: 1 / span 2; margin-bottom: 0; }
      .entry-lg { grid-template-columns: max-content 1fr; }
    }
    .side-mid { display: none; flex-direction: column; align-items: center; gap: var(--space-4); }
    .side-mid::before, .side-mid::after { content: ""; flex: 1; width: var(--border-w); background: var(--hairline); }
    .section-head .lead { margin-top: var(--space-4); }
    .split { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
    .split-head { margin-bottom: var(--space-6); }
    .split .lead + .lead, .split .muted + .lead { margin-top: var(--space-5); }
    .split h2 + .lead { margin-top: var(--space-4); }
    /* One panel, three rows: the problem's cases beside its copy rather than beneath it */
    .panel { background: var(--surface-1); border: var(--border-w) solid var(--hairline); border-radius: var(--radius-sm); }
    .panel .row { display: grid; grid-template-columns: auto 1fr; column-gap: var(--space-4); row-gap: var(--space-2); align-items: baseline; padding: var(--space-5); border-top: var(--border-w) solid var(--hairline); }
    .panel .row:first-child { border-top: 0; }
    .panel .idx { font-family: var(--font-mono); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 0.14em; color: var(--ink-muted); }
    .panel h3 { color: var(--ink); }
    .panel p { grid-column: 2; font-size: 15px; line-height: 1.55; color: var(--ink-muted); }
    .footnote { margin-top: var(--space-5); padding-top: var(--space-4); border-top: var(--border-w) solid var(--hairline); font-size: 15px; line-height: 1.55; color: var(--ink-muted); }
    .footnote strong { color: var(--ink); }
    /* The analogy: a raised slab like every card, larger type, one highlighted phrase */
